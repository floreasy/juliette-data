# juliettedata.fr — servi par nginx derrière le proxy de Coolify (TLS chez
# Coolify, http ici). Une seule adresse publique : https://juliettedata.fr.
server {
    listen 80;
    server_name _;
    root /srv/site;
    index index.html;
    charset utf-8;
    server_tokens off;
    # Redirections relatives : nginx ne voit que du http, il ne doit pas
    # fabriquer d'adresse absolue en http.
    absolute_redirect off;

    # www → apex, en 301, chemin et paramètres conservés.
    if ($host = www.juliettedata.fr) {
        return 301 https://juliettedata.fr$request_uri;
    }
    # Une seule adresse pour l'accueil. Sur $request_uri, pas sur $uri : la
    # directive index réécrit « / » en /index.html, ce qui bouclerait.
    if ($request_uri ~ "^/index\.html(\?|$)") {
        return 301 /$is_args$args;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/xml text/plain;

    location / {
        try_files $uri $uri/ =404;
        expires -1;
    }
    # Les polices ne changent jamais de contenu sous un même nom.
    location /fonts/ {
        expires 1y;
    }
    # Feuille, scripts et portrait ne sont pas versionnés : cache court.
    location ~* \.(css|js|svg|jpg|xml|txt)$ {
        expires 10m;
    }

    error_page 404 /404.html;
}
